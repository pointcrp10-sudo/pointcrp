        /* Меню: сетка 2×2, которая на широких экранах становится одним рядом */
        .game-menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 28px;
    width: 100%;
    max-width: 750px;
}

@media (min-width: 900px) {
    .game-menu {
        grid-template-columns: repeat(3, 1fr);
    }
}

.menu-btn {
    background: rgba(255, 255, 255, 0.03);
    border: 2px solid rgba(0, 242, 254, 0.2);
    color: #e2e8f0;
    padding: 14px 8px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.25;
    min-height: 56px;
}

        .menu-btn:hover {
            background: rgba(0, 242, 254, 0.1);
            border-color: #00f2fe;
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.3);
        }

        .menu-btn.active {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 22px rgba(0, 242, 254, 0.45);
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: #141423;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
            border: 1px solid rgba(0, 242, 254, 0.15);
            overflow: hidden;
        }

        iframe {
            border: none;
            width: 100%;
            height: 700px;
            display: block;
        }
